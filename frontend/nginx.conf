server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend container
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Always revalidate index.html so a rebuilt app shows up on a normal refresh
  # (the JS/CSS files have hashed names, so they can be cached).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Angular routes fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
